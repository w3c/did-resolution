openapi: 3.1.0
servers:
  - url: "/1.0/"
info:
  title: DID Resolution
  description: DID Resolution
  version: 1.0.0
  contact:
    name: W3C Decentralized Identifier Working Group
    url: https://www.w3.org/groups/wg/did/
paths:
  "/identifiers/{identifier}":
    get:
      summary: Resolve a DID
      description: <p>This endpoint resolves a DID.
        It takes the DID and resolution options as inputs, and
        the output is a DID document plus metadata.</p>
        <p>See the <a href="<a href="https://www.w3.org/TR/did-resolution/">DID
        Resolution</a> specification for additional details.</p>
      operationId: resolve
      tags:
        - Universal Resolver
      parameters:
        - in: path
          required: true
          name: identifier
          schema:
            type: string
          description: The DID to be resolved.
          examples:
            example1:
              value: did:indy:sovrin:builder:VbPQNHsvoLZdaNU7fTBeFx
              description: A DID using the `indy` method.
            example2:
              value: did:ion:EiClkZMDxPKqC9c-umQfTkR8vvZ9JPhl_xLDI9Nfk38w5w
              description: A DID using the `ion` method.
            example3:
              value: did:ebsi:z25ZZFS7FweHsm9MX2Qvc6gc
              description: A DID using the `ebsi` method.
        - in: header
          required: false
          name: Accept
          schema:
            type: string
          description: The requested media type of the DID document representation or
            DID resolution result.
          examples:
            application/did:
              value: application/did
              description: Media type of a DID document.
            application/did-resolution:
              value: application/did-resolution
              description: Media type of a DID resolution result.
        - in: query
          name: options
          schema:
            $ref: "#/components/schemas/ResolutionOptions"
          description: The options for resolving the DID.
          style: form
          explode: true
    post:
      summary: Resolve a DID
      description: <p>This endpoint resolves a DID.
        It takes the DID and resolution options as inputs, and
        the output is a DID document plus metadata.</p>
        <p>See the <a href="<a href="https://www.w3.org/TR/did-resolution/">DID
        Resolution</a> specification for additional details.</p>
      operationId: resolve
      tags:
        - Universal Resolver
      parameters:
        - in: path
          required: true
          name: identifier
          schema:
            type: string
          description: The DID to be resolved.
          examples:
            example1:
              value: did:indy:sovrin:builder:VbPQNHsvoLZdaNU7fTBeFx
              description: A DID using the `indy` method.
            example2:
              value: did:ion:EiClkZMDxPKqC9c-umQfTkR8vvZ9JPhl_xLDI9Nfk38w5w
              description: A DID using the `ion` method.
            example3:
              value: did:ebsi:z25ZZFS7FweHsm9MX2Qvc6gc
              description: A DID using the `ebsi` method.
        - in: header
          required: false
          name: Accept
          schema:
            type: string
          description: The requested media type of the DID document representation or
            DID resolution result.
          examples:
            application/did:
              value: application/did
              description: Media type of a DID document.
            application/did-resolution:
              value: application/did-resolution
              description: Media type of a DID resolution result.
      requestBody:
        content:
          application/did-resolution:
            schema:
              $ref: "#/components/schemas/ResolutionOptions"
        description: The options for resolving the DID.
      responses:
        "200":
          description: successfully resolved!
          content:
            application/did:
              schema:
                type: object
                description: The DID document.
                example:
                  "@context": https://www.w3.org/ns/did/v1.1
                  id: did:indy:sovrin:WRfXPg8dantKVubE3HX8pw
                  verificationMethod:
                    - id: did:indy:sovrin:WRfXPg8dantKVubE3HX8pw#key-1
                      type: Ed25519VerificationKey2018
                      publicKeyBase58: H3C2AVvLMv6gmMNam3uVAjZpfkcJCwDwnZn6z3wXmqPV
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
        "400":
          description: Invalid DID.
          content:
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
        "404":
          description: DID not found.
          content:
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
        "406":
          description: Representation not supported.
          content:
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
        "410":
          description: Successfully resolved, but DID is deactivated.
          content:
            application/did:
              schema:
                type: object
                description: The deactivated DID document.
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
        "500":
          description: Internal Error.
          content:
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
        "501":
          description: DID method not supported.
          content:
            application/did-resolution:
              schema:
                $ref: "#/components/schemas/ResolutionResult"
components:
  schemas:
    ResolutionOptions:
      description: The DID resolution options. See https://www.w3.org/TR/did-resolution/#did-resolution-options
      type: object
      properties:
        expandRelativeUrls:
          type: boolean
        versionId:
          type: string
        versionTime:
          type: string
          format: date-time
      additionalProperties: { }
    ResolutionResult:
      description: The DID resolution result.
      type: object
      properties:
        didDocument:
          type: object
        didResolutionMetadata:
          $ref: "#/components/schemas/DidResolutionMetadata"
        didDocumentMetadata:
          $ref: "#/components/schemas/DidDocumentMetadata"
    DidResolutionMetadata:
      type: object
      properties:
        contentType:
          type: string
        error:
          $ref: "#/components/schemas/RFC9457ProblemDetails"
      additionalProperties: { }
    DidDocumentMetadata:
      type: object
      properties:
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        deactivated:
          type: string
        nextUpdate:
          type: string
          format: date-time
        versionId:
          type: string
        nextVersionId:
          type: string
        equivalentId:
          type: array
          items:
            type: string
        canonicalId:
          type: string
      additionalProperties: { }
    RFC9457ProblemDetails:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
      additionalProperties: { }